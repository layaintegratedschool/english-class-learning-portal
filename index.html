
<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <title>English Class Learning Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f4f5f0;
      color: #202923;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .school-name {
      color: #245748;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0;
      color: #173b32;
      font-size: 27px;
    }

    .subtitle {
      color: #68736c;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce2dc;
      border-radius: 10px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #245748;
      border-color: transparent;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #173b32;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      min-height: 22px;
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
    }

    .footer {
      margin-top: 25px;
      color: #879087;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="login-card">
    <div class="school-name">Laya Integrated School</div>

    <h1>English Class Portal</h1>

    <p class="subtitle">
      Welcome! Sign in to access your English learning materials
      and classroom resources.
    </p>

    <form id="loginForm">
      <label for="username">Username or Email</label>
      <input
        id="username"
        type="text"
        placeholder="Enter your username or email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Sign In</button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">
      English Learning Portal · Grades 7–10
    </div>
  </main>
<script>
  const SUPABASE_URL = "https://njozhfubaagfusenxlxe.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
</script>
</body>
</html>
